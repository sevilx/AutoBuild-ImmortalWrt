name: Build ImmortalWrt

# ============================================================================
#  ImmortalWrt firmware builder (upstream: immortalwrt/immortalwrt)
#  Targets: x86_64 / x86_32 / armsr_armv8 / armsr_armv7
#  Built in: nikki (mihomo), Turbo ACC (BBR / flow offload / FullCone NAT),
#            China opkg mirror helper
#
#  Manual dispatch only - nothing is built automatically.
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Upstream branch'
        type: choice
        default: 'openwrt-24.10'
        options:
          - openwrt-24.10
          - openwrt-25.12
          - master
      targets:
        description: 'Targets, comma separated (e.g. x86_64,armsr_armv8) or "all"'
        type: string
        default: 'all'
      release:
        description: 'Create a GitHub Release after a successful build'
        type: boolean
        default: true
      dry_run:
        description: 'Only generate and validate .config (no download, no compile)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  SRC_REPO: https://github.com/immortalwrt/immortalwrt

jobs:
  # ------------------------------------------------------------- plan matrix
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      branch: ${{ steps.plan.outputs.branch }}
      tag: ${{ steps.plan.outputs.tag }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build matrix
        id: plan
        env:
          IN_BRANCH: ${{ inputs.branch }}
          IN_TARGETS: ${{ inputs.targets }}
          IN_RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          branch="${IN_BRANCH:-openwrt-24.10}"
          targets="${IN_TARGETS:-all}"
          release="${IN_RELEASE:-true}"

          matrix="$(python3 .github/plan.py --branch "$branch" --targets "$targets")"
          tag="immortalwrt-${branch#openwrt-}-$(date -u +%Y%m%d-%H%M)"

          {
            echo "matrix=${matrix}"
            echo "branch=${branch}"
            echo "release=${release}"
            echo "tag=${tag}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Build plan"
            echo ""
            echo "- Upstream branch: \`${branch}\`"
            echo "- Create release: \`${release}\`"
            echo "- Targets:"
            echo "${matrix}" | python3 -c 'import json,sys; [print("  - `%s` (%s)" % (i["id"], i["name"])) for i in json.load(sys.stdin)["include"]]'
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------- build
  build:
    name: ${{ matrix.name }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/lib/jvm /usr/local/lib/node_modules
          sudo swapoff -a || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq -y install \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget qemu-utils ccache
          df -h /

      - name: Clone upstream
        run: |
          git clone --depth 1 -b "${{ needs.prepare.outputs.branch }}" "$SRC_REPO" openwrt
          cd openwrt
          git log -1 --pretty='upstream commit: %h %s (%ad)' --date=iso

      - name: Restore dl / ccache
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            ~/.ccache
          key: dl-${{ needs.prepare.outputs.branch }}-${{ matrix.id }}-${{ github.run_id }}
          restore-keys: |
            dl-${{ needs.prepare.outputs.branch }}-${{ matrix.id }}-
            dl-${{ needs.prepare.outputs.branch }}-

      - name: Inject feeds / custom packages / rootfs overlay
        run: bash scripts/diy.sh

      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate .config
        run: |
          cd openwrt
          cat ../configs/common.config "../configs/${{ matrix.config }}" > .config
          make defconfig
          bash ../scripts/check-config.sh "${{ matrix.board }}" "${{ matrix.subtarget }}" "${{ matrix.id }}"

      # ------------------------------------------------------- dry_run stops here
      - name: Download sources
        if: inputs.dry_run != true
        run: |
          cd openwrt
          make download -j8 || make download -j1 V=s

      - name: Compile firmware
        if: inputs.dry_run != true
        run: |
          cd openwrt
          make -j"$(( $(nproc) + 1 ))" || make -j1 V=s

      - name: Collect images
        if: inputs.dry_run != true
        run: |
          set -euo pipefail
          mkdir -p out
          find openwrt/bin/targets -type f \
            ! -name '*.buildinfo' \
            ! -name 'profiles.json' \
            ! -name 'sha256sums' \
            ! -path '*/packages/*' \
            -exec cp -f {} out/ \;
          cd out
          [ -n "$(ls -A)" ] || { echo "::error::no image was produced"; exit 1; }
          ls -lh
          sha256sum ./* > SHA256SUMS.txt

      - name: Upload artifacts
        if: inputs.dry_run != true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}
          path: out/
          if-no-files-found: error
          compression-level: 0

      - name: Summary
        if: always()
        run: |
          {
            echo "### ${{ matrix.name }}"
            echo ""
            echo "- Branch: \`${{ needs.prepare.outputs.branch }}\`"
            grep -E '^CONFIG_TARGET_(BOARD|SUBTARGET|ARCH_PACKAGES)=' openwrt/.config || true
          } >> "$GITHUB_STEP_SUMMARY"

  # ----------------------------------------------------------------- release
  release:
    name: Publish release
    needs: [prepare, build]
    if: needs.prepare.outputs.release == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd artifacts
          rm -f SHA256SUMS.txt
          ls -lh
          sha256sum ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate release notes
        run: |
          {
            echo "## ImmortalWrt firmware" 
            echo ""
            echo "- Upstream: [\`immortalwrt/immortalwrt\`](https://github.com/immortalwrt/immortalwrt) @ \`${{ needs.prepare.outputs.branch }}\`"
            echo "- Built at: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S %Z')"
            echo "- Commit: \`${{ github.sha }}\`"
            echo ""
            echo "### Included"
            echo ""
            echo "| Item | Notes |"
            echo "| --- | --- |"
            echo "| nikki (mihomo-meta) | Transparent proxy, LuCI menu \`Services -> Nikki\` |"
            echo "| Turbo ACC | \`Network -> Turbo ACC\`: BBR / software flow offload / HW NAT / FullCone NAT |"
            echo "| China opkg mirror | Auto-picks the fastest mirror (USTC / NJU / ZJU) on first boot; \`opkg-mirror\` to switch manually |"
            echo "| LuCI | Chinese UI by default, Argon theme, ttyd, UPnP, DDNS |"
            echo ""
            echo "### Flashing"
            echo ""
            echo "- Default address \`192.168.1.1\`, user \`root\`, **no password** (set one right after the first login)"
            echo "- x86: \`*-squashfs-combined-efi.img.gz\` for UEFI, \`*-squashfs-combined.img.gz\` for legacy BIOS"
            echo "- x86: use the **squashfs combined** image for \`sysupgrade\`, so settings survive the upgrade"
            echo "- ARM: write \`*-combined-efi.img\` to SD card / eMMC / virtual disk"
            echo "- Running nikki? Disable \"Hardware flow offloading (HW NAT)\" in Turbo ACC if the proxy misbehaves"
            echo ""
            echo "Upgrade with settings kept: \`sysupgrade -v *-squashfs-combined-efi.img.gz\` (see README)"
            echo ""
            echo "Checksums: \`SHA256SUMS.txt\`"
          } > release-notes.md
          cat release-notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          body_path: release-notes.md
          files: artifacts/*
          fail_on_unmatched_files: false
          make_latest: true
