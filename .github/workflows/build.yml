name: Build ImmortalWrt

# ============================================================================
#  ImmortalWrt 自动编译（上游：https://github.com/immortalwrt/immortalwrt）
#  目标：x86_64 / x86_32 / armv8(aarch64) / armv7
#  默认内置：nikki(mihomo) 、Turbo ACC(BBR/流量分载/FullCone NAT) 、国内 opkg 源脚本
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'ImmortalWrt 源码分支'
        type: choice
        default: 'openwrt-24.10'
        options:
          - openwrt-24.10
          - openwrt-25.12
          - master
      targets:
        description: '编译目标（逗号分隔，例如 x86_64,armsr_armv8；all = 全部）'
        type: string
        default: 'all'
      release:
        description: '编译完成后创建 GitHub Release'
        type: boolean
        default: true

  schedule:
    # 每周六 01:00（北京时间）自动编译；仅产出 Artifacts，不发 Release
    - cron: '0 17 * * 5'

  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  SRC_REPO: https://github.com/immortalwrt/immortalwrt

jobs:
  # ---------------------------------------------------------------- 规划矩阵
  prepare:
    name: 准备
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      branch: ${{ steps.plan.outputs.branch }}
      tag: ${{ steps.plan.outputs.tag }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 生成编译矩阵
        id: plan
        env:
          IN_BRANCH: ${{ github.event.inputs.branch }}
          IN_TARGETS: ${{ github.event.inputs.targets }}
          IN_RELEASE: ${{ github.event.inputs.release }}
        run: |
          set -euo pipefail
          branch="${IN_BRANCH:-openwrt-24.10}"
          targets="${IN_TARGETS:-all}"

          if [ -n "${IN_RELEASE:-}" ]; then
            release="${IN_RELEASE}"
          elif [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            release="false"
          else
            release="true"
          fi

          matrix="$(python3 .github/plan.py --branch "$branch" --targets "$targets")"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="immortalwrt-${branch#openwrt-}-$(date -u +%Y%m%d)"
          fi

          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          echo "release=${release}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          {
            echo "### 编译计划"
            echo ""
            echo "- 上游分支：\`${branch}\`"
            echo "- 是否发布 Release：\`${release}\`"
            echo "- 目标："
            echo "${matrix}" | python3 -c 'import json,sys; [print("  - `%s` (%s)" % (i["id"], i["name"])) for i in json.load(sys.stdin)["include"]]'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------- 编译
  build:
    name: ${{ matrix.name }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/lib/jvm /usr/local/lib/node_modules
          sudo swapoff -a || true
          df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq -y install \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget qemu-utils ccache
          df -h /

      - name: 克隆上游源码
        run: |
          git clone --depth 1 -b "${{ needs.prepare.outputs.branch }}" "$SRC_REPO" openwrt
          cd openwrt
          git log -1 --pretty='上游提交：%h %s（%ad）' --date=iso

      - name: 缓存 dl / ccache
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            ~/.ccache
          key: dl-${{ needs.prepare.outputs.branch }}-${{ matrix.id }}-${{ github.run_id }}
          restore-keys: |
            dl-${{ needs.prepare.outputs.branch }}-${{ matrix.id }}-
            dl-${{ needs.prepare.outputs.branch }}-

      - name: 注入 nikki 源 / 自定义插件 / rootfs 覆盖层
        run: bash scripts/diy.sh

      - name: 更新并安装 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 生成 .config
        run: |
          cd openwrt
          cat ../configs/common.config "../configs/${{ matrix.config }}" > .config
          make defconfig
          bash ../scripts/check-config.sh "${{ matrix.board }}" "${{ matrix.subtarget }}" "${{ matrix.id }}"

      - name: 下载依赖源码
        run: |
          cd openwrt
          make download -j8 || make download -j1 V=s

      - name: 编译固件
        run: |
          cd openwrt
          make -j"$(( $(nproc) + 1 ))" || make -j1 V=s

      - name: 收集固件
        run: |
          set -euo pipefail
          mkdir -p out
          find openwrt/bin/targets -type f \
            ! -name '*.buildinfo' \
            ! -name 'profiles.json' \
            ! -name 'sha256sums' \
            ! -path '*/packages/*' \
            -exec cp -f {} out/ \;
          cd out
          [ -n "$(ls -A)" ] || { echo "::error::没有生成任何固件"; exit 1; }
          ls -lh
          sha256sum ./* > SHA256SUMS.txt

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}
          path: out/
          if-no-files-found: error
          compression-level: 0

      - name: 汇总信息
        if: always()
        run: |
          {
            echo "### ${{ matrix.name }}"
            echo ""
            echo "- 分支：\`${{ needs.prepare.outputs.branch }}\`"
            grep -E '^CONFIG_TARGET_(BOARD|SUBTARGET|ARCH_PACKAGES)=' openwrt/.config || true
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------- 发布
  release:
    name: 发布 Release
    needs: [prepare, build]
    if: needs.prepare.outputs.release == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 生成校验文件
        run: |
          set -euo pipefail
          cd artifacts
          rm -f SHA256SUMS.txt
          ls -lh
          sha256sum ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 生成发布说明
        run: |
          {
            echo "## ImmortalWrt 自动编译固件"
            echo ""
            echo "- 上游源码：[\`immortalwrt/immortalwrt\`](https://github.com/immortalwrt/immortalwrt) @ \`${{ needs.prepare.outputs.branch }}\`"
            echo "- 构建时间：$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S %Z')"
            echo "- 提交：\`${{ github.sha }}\`"
            echo ""
            echo "### 内置内容"
            echo ""
            echo "| 项目 | 说明 |"
            echo "| --- | --- |"
            echo "| nikki (mihomo-meta) | 透明代理，LuCI 菜单 \`服务 → Nikki\` |"
            echo "| Turbo ACC | \`网络 → Turbo ACC 网络加速\`：BBR / 软件流量分载 / HW NAT / FullCone NAT |"
            echo "| 国内 opkg 源 | 首次联网自动择优（USTC / NJU / ZJU），也可 \`opkg-mirror\` 手动切换 |"
            echo "| LuCI | 默认中文，含 Argon 主题、ttyd、UPnP、DDNS |"
            echo ""
            echo "### 刷机提示"
            echo ""
            echo "- 默认地址 \`192.168.1.1\`，用户 \`root\`，默认**无密码**（首次登录后请立即设置）"
            echo "- x86：\`*-combined-efi.img.gz\` 用于 UEFI 启动，\`*-combined.img.gz\` 用于传统 BIOS"
            echo "- arm：\`*-combined-efi.img.gz\` 直接写入 SD 卡 / eMMC / 虚拟磁盘"
            echo "- 使用透明代理（nikki）时若出现异常，请在 Turbo ACC 中关闭「硬件流量分载 (HW NAT)」"
            echo ""
            echo "校验文件：\`SHA256SUMS.txt\`"
          } > release-notes.md
          cat release-notes.md

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          body_path: release-notes.md
          files: artifacts/*
          fail_on_unmatched_files: false
          make_latest: true
